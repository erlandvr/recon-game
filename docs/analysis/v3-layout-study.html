<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V3 spatial study</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10130f;color:#f4f3ee;font:15px/1.35 system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}header{padding:14px 20px;display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid #485041}h1{font-size:22px;margin:0}p{margin:4px 0;color:#c3c8bd}label{font-size:14px;display:inline-flex;align-items:center;gap:6px;margin:3px}select{font:inherit;background:#272e23;color:#fff;border:1px solid #7d8c70;padding:7px;border-radius:4px}select:focus-visible{outline:3px solid #e8ba54;outline-offset:2px}main{flex:1;min-height:0;padding:8px 16px}svg{display:block;width:100%;height:100%;background:#171c15;border:1px solid #46533e;border-radius:6px}footer{padding:10px 20px 14px;border-top:1px solid #485041}.hud{display:flex;justify-content:space-between;gap:14px;margin-bottom:7px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.actions span{padding:9px 12px;border:1px solid #78896d;border-radius:5px;color:#dce7d4;background:#283222;white-space:nowrap}#metrics{font-size:13px}svg text{font-family:system-ui,sans-serif} @media(max-width:900px){header{padding:8px 16px}h1{font-size:19px}header p{max-width:310px;font-size:13px}.actions{gap:6px}.actions span{font-size:13px;padding:9px 6px}footer{padding:8px 16px}label{font-size:13px}}
</style></head><body>
<header><div><h1>V3 · spatial study</h1><p>Illustrative scale and placement. Not a playable game or final artwork.</p></div><div><label>Machine height<select id="ratio"><option value="2">2 × developer</option><option value="2.5" selected>2.5 × developer</option><option value="3">3 × developer</option></select></label><label>Scene<select id="phase"><option value="delivery">Carry to cluster</option><option value="assembly">Assemble at bench</option></select></label></div></header>
<main><svg id="scene" viewBox="0 0 1000 580" role="img" aria-label="Twelve system positions in three clusters, four developer workbenches, a carrying developer and three Recon maintenance slots"></svg></main>
<footer><div class="hud"><span>Illustrative HUD: <b>480 / 1,200 cr</b> · 01:12</span><span id="metrics"></span></div><div class="actions" aria-label="Space reserved for purchase controls; not interactive"><span>Build system · 45</span><span>Hire developer · 55</span><span>Recon · 180</span><span>Recon Plus · 260</span></div></footer>
<script>
const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';
function tag(t,a={},children=''){return `<${t} ${Object.entries(a).map(([k,v])=>`${k}="${v}"`).join(' ')}>${children}</${t}>`}
function txt(x,y,t,size=18,fill='#cbd5c4'){return tag('text',{x,y,'font-size':size,fill},t)}
const positions=[[80,145],[215,130],[80,285],[215,270],[410,135],[555,155],[410,280],[555,285],[95,475],[245,510],[410,475],[555,510]];
function machine(x,y,id,kind,h){const w=h*.84;let stroke=kind==='failed'?'#ec9469':kind==='ghost'?'#85927a':'#a9d29b';return tag('g',{'class':'machine','data-id':id,transform:`translate(${x} ${y})`},tag('rect',{x:-w/2,y:-h,width:w,height:h,rx:6,fill:kind==='ghost'?'#171c15':'#344230',stroke,'stroke-width':2,'stroke-dasharray':kind==='ghost'?'5 5':'none'})+(kind==='ghost'?txt(-20,-h/2,'12',18):tag('rect',{x:-w*.3,y:-h*.78,width:w*.6,height:h*.24,rx:3,fill:kind==='failed'?'#292521':'#b5dd9e'})+tag('path',{d:`M ${-w*.26} ${-h*.3} h ${w*.52} m ${-w*.52} 10 h ${w*.52}`,stroke:'#8f9f82','stroke-width':3})+tag('circle',{cx:w*.32,cy:-h+8,r:4,fill:stroke}))+txt(-12,23,String(id).padStart(2,'0'),16));}
function dev(x,y,mode,load,h){let body=tag('circle',{cx:mode==='carry'?9:0,cy:-27,r:5,fill:'#eec6a3'})+tag('path',{d:mode==='carry'?'M 5 -20 L -3 -10 L -10 -1 M -3 -10 L 7 -1 M 5 -19 L 16 -12':'M 0 -20 L 0 -10 M 0 -10 L -6 0 M 0 -10 L 6 0 M 0 -18 L -9 -10 M 0 -18 L 9 -10',stroke:'#f0a766','stroke-width':6,'stroke-linecap':'round',fill:'none'});let w=h*.84;let pack=load?tag('rect',{'class':'carried',x:-w*.85,y:-h-17,width:w,height:h,rx:6,fill:'#536844',stroke:'#d0e8bc','stroke-width':2})+tag('path',{d:`M ${-w*.7} ${-h-1} h ${w*.5} m ${-w*.5} 12 h ${w*.5}`,stroke:'#a9d29b','stroke-width':4}):'';return tag('g',{'class':'developer','data-mode':mode,transform:`translate(${x} ${y})`},pack+body);}
function render(){let r=Number($('ratio').value),h=32*r,phase=$('phase').value;
let s=tag('rect',{x:730,y:15,width:255,height:350,rx:10,fill:'#21291d',stroke:'#59654f'})+txt(750,44,'Developer workbenches',18)+tag('rect',{x:730,y:385,width:255,height:175,rx:10,fill:'#232d27',stroke:'#5c7865'})+txt(750,415,'Recon Plus · 3 slots',18);
const edges=[[0,1],[0,2],[1,3],[2,3],[4,5],[4,6],[5,7],[6,7],[8,9],[9,10],[10,11],[1,4],[3,6],[2,8],[6,10]];
for(let [a,b] of edges){let p=positions[a],q=positions[b];s+=tag('path',{d:`M ${p[0]} ${p[1]-h/2} L ${q[0]} ${q[1]-h/2}`,stroke:'#52664a','stroke-width':3,fill:'none'});}
s+=txt(25,35,'Cluster A',18)+txt(370,35,'Cluster B',18)+txt(25,365,'Cluster C',18);
// Reserved site belongs to the carried or bench-built system: twelve positions, not thirteen systems.
positions.forEach((p,i)=>{s+=machine(...p,i+1,i===11?'ghost':i===3?'failed':'working',h)});
for(let [i,x,y] of [[1,795,185],[2,925,185],[3,795,335],[4,925,335]]){s+=tag('g',{'class':'bench'},tag('path',{d:`M ${x-43} ${y-17} h 86 M ${x-35} ${y-17} v 20 M ${x+35} ${y-17} v 20`,stroke:'#a6a48a','stroke-width':6})+txt(x-36,y+25,`Bench ${i}`,16));}
for(let i=0;i<3;i++){let x=749+i*76;s+=tag('g',{'class':'slot'},tag('rect',{x,y:440,width:65,height:83,rx:5,fill:'#344c3d',stroke:'#8bb19a'})+txt(x+23,466,String(i+1),18)+tag('rect',{x:x+9,y:486,width:47,height:8,rx:3,fill:'#1d2c23'})+tag('rect',{x:x+9,y:486,width:15+i*12,height:8,rx:3,fill:'#b5d7a6'}));}
s+=txt(752,547,'Pickup → work → complete',15);
if(phase==='delivery'){
s+=tag('path',{'class':'route',d:'M 795 185 L 685 185 L 685 410 L 555 410 L 555 510',fill:'none',stroke:'#e5bc65','stroke-width':2,'stroke-dasharray':'6 6'});
s+=dev(665,410,'carry',true,h)+dev(790,315,'idle',false,h)+dev(930,165,'idle',false,h)+dev(275,270,'repair',false,h);
}else{s+=machine(788,150,12,'working',h)+dev(840,155,'build',false,h)+dev(790,315,'idle',false,h)+dev(930,165,'idle',false,h)+dev(275,270,'repair',false,h);}
s+=tag('circle',{cx:702,cy:50,r:9,fill:'#e7bd57'})+txt(600,55,'+24 cr/s',20)+tag('path',{d:'M 555 510 Q 705 170 702 50',fill:'none',stroke:'#b89b56','stroke-width':1,'stroke-dasharray':'3 8'});
s+=txt(25,558,'11 installed + 1 build/delivery · four developers · dashed lines are study guides',16);
$('scene').innerHTML=s;updateMetrics();window.study={ratio:r,phase,machineHeight:h,developerHeight:32,positions};}
function updateMetrics(){let b=$('scene').getBoundingClientRect(),scale=Math.min((b.width-2)/1000,(b.height-2)/580);$('metrics').textContent=`Developer ${Math.round(32*scale)} px · machine ${Math.round(32*Number($('ratio').value)*scale)} px`;}
$('ratio').onchange=render;$('phase').onchange=render;window.addEventListener('resize',updateMetrics);render();
</script></body></html>
